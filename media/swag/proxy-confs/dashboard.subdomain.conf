## Version 2024/07/27
# LAN-only SWAG dashboard, replacing the default conf installed by the
# swag-dashboard mod. The mod's sample also contains a `listen 443 ssl`
# server block for dashboard.<domain>, which publishes the dashboard
# through the public-facing HTTPS listener -- that block is deliberately
# omitted here so the dashboard only exists on port 81
# (http://<server-ip>:81), which is never forwarded by the router.
# The mod won't overwrite this file (it only copies its default when no
# dashboard.subdomain.conf exists).

server {
    listen 81;

    server_name _;

    root /dashboard/www;
    index index.php;

    client_max_body_size 0;

    location / {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        try_files $uri $uri/ /index.php$is_args$args =404;
    }

    location ~ ^(.+\.php)(.*)$ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        fastcgi_split_path_info ^(.+\.php)(.*)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
    }
}
