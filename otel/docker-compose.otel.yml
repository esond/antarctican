# Observability stack: one OTLP intake (the OpenTelemetry Collector) feeding
# VictoriaMetrics for metrics, Tempo for traces and Loki for logs, with Grafana
# on top. Clients push OTLP to the collector on ${OTEL_COLLECTOR_HOST_PORT};
# anything that only exposes a Prometheus /metrics endpoint is scraped by the
# collector instead. Collector, Tempo, Loki and Grafana configs are tracked
# under this directory and copied into appdata -- see README.

networks:
  otel-net:
    driver: bridge

services:
  # Single entry point for telemetry. Receives OTLP/HTTP from OpenClaw, reads
  # host metrics from the read-only root mount, container stats through
  # dockersocket-otel, and scrapes the Prometheus endpoints listed in
  # otel-collector/config.yaml. Other stacks are reached through their
  # published host ports via host.docker.internal, so this stack starts and
  # stops independently of them.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    user: ${PUID}:${PGID}
    depends_on:
      - dockersocket-otel
      - victoriametrics
      - tempo
      - loki
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - TZ=${TZ}
      - UNPACKERR_METRICS_PORT=${UNPACKERR_METRICS_PORT}
      - FLARESOLVERR_METRICS_PORT=${FLARESOLVERR_METRICS_PORT}
      - CLOUDFLARED_METRICS_PORT=${CLOUDFLARED_METRICS_PORT}
      - COUCHDB_PORT=${COUCHDB_PORT}
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ${APPDATA}/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Host root for the hostmetrics receiver (root_path: /hostfs in config).
      - /:/hostfs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # OTLP/HTTP. OpenClaw (claw stack) pushes here.
      - ${OTEL_COLLECTOR_HOST_PORT}:4318
    restart: unless-stopped
    networks:
      - otel-net
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/selfhst/icons/refs/heads/main/png/opentelemetry.png"
      net.unraid.docker.shell: "sh"

  # Docker API proxy for the collector's docker_stats receiver: container read
  # only, no POST. Same pattern as dockersocket in the media stack; a separate
  # instance so this stack doesn't depend on media-net.
  dockersocket-otel:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockersocket-otel
    environment:
      - TZ=${TZ}
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - otel-net
    labels:
      net.unraid.docker.shell: "sh"

  # Metrics store. Takes Prometheus remote-write from the collector; Grafana
  # queries it as a Prometheus datasource. The host port is for vmui
  # (http://<ip>:port/vmui), handy for checking what actually arrived.
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    user: ${PUID}:${PGID}
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${VICTORIAMETRICS_RETENTION}
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/victoriametrics:/victoria-metrics-data
    ports:
      - ${VICTORIAMETRICS_HOST_PORT}:8428
    restart: unless-stopped
    networks:
      - otel-net
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:${VICTORIAMETRICS_HOST_PORT}]/vmui"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/selfhst/icons/refs/heads/main/png/victoriametrics.png"
      net.unraid.docker.shell: "sh"

  # Trace store. Takes OTLP/gRPC from the collector on otel-net only; Grafana
  # queries it on 3200. Local-disk backend, retention set in tempo/tempo.yaml.
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    user: ${PUID}:${PGID}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ${APPDATA}/tempo/data:/var/tempo
    restart: unless-stopped
    networks:
      - otel-net
    labels:
      net.unraid.docker.shell: "sh"

  # Log store. Takes OTLP/HTTP from the collector on otel-net only; Grafana
  # queries it on 3100. Single-binary mode on local disk, retention set in
  # loki/loki.yaml.
  loki:
    image: grafana/loki:latest
    container_name: loki
    user: ${PUID}:${PGID}
    command: ["-config.file=/etc/loki/loki.yaml"]
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ${APPDATA}/loki/data:/loki
    restart: unless-stopped
    networks:
      - otel-net
    labels:
      net.unraid.docker.shell: "sh"

  # Dashboards. Datasources are provisioned from grafana/provisioning (copied
  # into appdata); dashboards are imported in the UI and persist in
  # ${APPDATA}/grafana/data.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: ${PUID}:${PGID}
    depends_on:
      - victoriametrics
      - tempo
      - loki
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ${APPDATA}/grafana/data:/var/lib/grafana
      - ${APPDATA}/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - ${GRAFANA_HOST_PORT}:3000
    restart: unless-stopped
    networks:
      - otel-net
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:${GRAFANA_HOST_PORT}]"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/selfhst/icons/refs/heads/main/png/grafana.png"
      net.unraid.docker.shell: "sh"
