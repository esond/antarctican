networks:
  claw-net:
    driver: bridge

services:
  # OpenClaw gateway + dashboard. The image runs as its own fixed user
  # (node, uid 1000) and does not honor PUID/PGID -- chown the appdata
  # dirs and workspace share to 1000:1000 (see README).
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Authenticates the bind-mounted op CLI (README step 10). The service
      # account must be scoped read-only to the agent vault -- anything it
      # can read, a prompt injection can read.
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN}
    volumes:
      - ${APPDATA}/openclaw/config:/home/node/.openclaw
      - ${APPDATA}/openclaw/auth-secret:/home/node/.config/openclaw
      # Agent workspace lives on its own share -- never mount other shares
      # here. Anything the agent can read, a prompt injection can read.
      - ${CLAW_WORKSPACE}:/home/node/.openclaw/workspace
      # 1Password CLI for the onepassword plugin -- a static binary fetched
      # onto the host (see README). Download it BEFORE starting the stack:
      # if the file is missing, Docker creates a directory at this path and
      # the mount breaks.
      - ${APPDATA}/openclaw/bin/op:/usr/local/bin/op:ro
    ports:
      # LAN access to the dashboard. Public access goes through cloudflared
      # below, never through a port-forward or SWAG.
      - ${OPENCLAW_HOST_PORT}:18789
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1m
    restart: unless-stopped
    networks:
      - claw-net
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:${OPENCLAW_HOST_PORT}]"
      net.unraid.docker.icon: "https://avatars.githubusercontent.com/u/252820863?s=200&v=4"
      net.unraid.docker.shell: "sh"

  # Outbound-only tunnel that publishes the dashboard at a public hostname
  # without opening any host ports. Ingress (hostname -> http://openclaw:18789)
  # and the Cloudflare Access policy in front of it are configured in the
  # Cloudflare Zero Trust dashboard, not here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-claw
    command: tunnel --no-autoupdate run
    depends_on:
      - openclaw
    environment:
      - TZ=${TZ}
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - claw-net
    labels:
      net.unraid.docker.icon: "https://avatars.githubusercontent.com/u/314135?s=200&v=4"

  # Headless Chromium for the agent's browser tool, attached over CDP
  # (browser.profiles config on the openclaw side -- see README). No
  # published port: reachable only on claw-net, and the token gates CDP
  # access on top of that.
  claw-browser:
    image: ghcr.io/browserless/chromium:latest
    container_name: claw-browser
    environment:
      - TZ=${TZ}
      - TOKEN=${BROWSERLESS_TOKEN}
    restart: unless-stopped
    networks:
      - claw-net
    labels:
      net.unraid.docker.icon: "https://avatars.githubusercontent.com/u/30044?s=60&v=4"

  # Local embedding model for OpenClaw's builtin memory search, reached at
  # http://ollama:11434 on claw-net. CPU-only is fine for a model this small.
  # No published port -- nothing outside the stack needs it.
  # Pulls its own model on start (a no-op once it exists) instead of using a
  # one-shot init container -- an exited container makes the Compose Manager
  # UI show the whole stack as stopped.
  ollama:
    image: ollama/ollama
    container_name: claw-ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      until ollama list >/dev/null 2>&1; do sleep 2; done &&
      ollama pull qwen3-embedding:0.6b &&
      wait"
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/claw-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'qwen3-embedding:0.6b'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    networks:
      - claw-net
    labels:
      net.unraid.docker.icon: "https://avatars.githubusercontent.com/u/151674099?s=200&v=4"
